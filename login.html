<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="ChatGPT Image Oct 30, 2026, 11_33_49 PM.png">
    <link rel="stylesheet" href="style.css">
    <title>Login - VERTORIDE</title>
</head>
<body class="stickyfooter">
    <header>
        <div id="panel">
            <div id="logo"><img src="vertoride_wordmark.svg" alt="logo" height="80px" width="350px"></div>
            <div class="parent">
                <div id="home" class="child"><a href="index.html">Home</a></div>
                <div id="rides" class="child"><a href="index.html#Services">Rides</a></div>
                <div id="contactus" class="child"><a href="contact.html">Contact Us</a></div>
                <div id="login" class="child"><a href="login.html" id="loginlink">Login / Sign Up</a></div>
            </div>
        </div>
    </header>
    <main>
        <div class="formcard">
            <div class="tabs">
                <button type="button" id="logintab" class="tabbtn active">Login</button>
                <button type="button" id="signuptab" class="tabbtn">Create Account</button>
            </div>

            <p id="message" class="msg hidden"></p>
            <form id="loginForm">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
                <button type="submit" class="formsubmit">Login</button>
            </form>
            <form id="signupForm" class="hidden">
                <label for="signupName">Full Name:</label>
                <input type="text" id="signupName" placeholder="Enter your name" required>
                <label for="signupEmail">Email:</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required>
                <label for="signupPassword">Password:</label>
                <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
                <label for="signupConfirm">Confirm Password:</label>
                <input type="password" id="signupConfirm" placeholder="Type the password again" required>
                <button type="submit" class="formsubmit">Create Account</button>
            </form>
        </div>
    </main>
    <footer>
        <div class="footer">
            Verto-Ride-
            Your journey our Responsibility <br>
            Phagwara, Punjab<br>
            © 2026 Vertoride all rights reserved
        </div>
    </footer>

    <script src="common.js"></script>
    <script src="login.js"></script>
</body>
</html>
